<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버디월드 :: 어느 학교냐?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#333; --sub:#777; --line:#b9c6d6; --paper:#fff; --bg:#dfe9f3;
  --main:#3d7fc4; --deep:#1f3f66; --point:#f2a900; --soft:#eef4fa;
  --gothic:Gulim,'굴림',Dotum,'돋움','Noto Sans KR',sans-serif;
  --hand:'Nanum Myeongjo','바탕',Batang,serif;--r:10px;
}
body.sk-haerim{--main:#2d5fb3;--deep:#1c2338;--point:#e8b923;--soft:#eef2fa;--bg:#d9e0ee;--line:#b4bfd6}
body.sk-seojin{--main:#1f6f6b;--deep:#12393a;--point:#d9435a;--soft:#fdf1f3;--bg:#dcebe9;--line:#aecbc8}
body.sk-baeksan{--main:#7a5a3c;--deep:#3d2a1c;--point:#b08d4f;--soft:#f8f3e6;--bg:#ebe3d2;--line:#cdbf9f}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--gothic);font-size:14px;line-height:1.65;color:#222;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.75) 1.2px,transparent 1.3px);
  background-size:12px 12px;min-height:100vh;overflow-x:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
a{color:var(--main)}
.hidden{display:none!important}

/* ---------- 입장 화면 ---------- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-box{width:100%;max-width:720px;background:var(--paper);border:1px solid #9fb2c8;box-shadow:4px 4px 0 rgba(31,63,102,.18)}
.gate-top{background:var(--deep);color:#fff;padding:6px 12px;font-size:11px;display:flex;justify-content:space-between;letter-spacing:.02em}
.gate-body{padding:28px 20px 24px;text-align:center}
.logo{font-weight:700;font-size:15px;letter-spacing:.18em;color:var(--main)}
.logo b{color:var(--point)}
.gate-q{font-size:clamp(34px,8vw,56px);font-weight:700;letter-spacing:-.04em;margin:14px 0 6px;color:#1c2338;line-height:1.15}
.gate-sub{color:var(--sub);margin:0 0 22px}
.schools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.sch{border:1px solid #9fb2c8;background:#fff;padding:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;transition:transform .12s}
.sch-band{flex:0 0 auto}
.sch-in{flex:1;display:flex;flex-direction:column}
.sch-go{margin-top:auto!important}
.sch-desc{margin-bottom:10px!important}
.sch:hover,.sch:focus-visible{transform:translate(-2px,-2px);box-shadow:3px 3px 0 rgba(0,0,0,.2);outline:none}
.sch-band{height:54px;display:flex}
.sch-band i{flex:1}
.sch-in{padding:10px 12px 12px}
.sch-name{font-size:19px;font-weight:700;letter-spacing:-.03em}
.sch-kind{font-size:11px;color:var(--sub)}
.sch-desc{margin:8px 0 0;font-size:12px;line-height:1.55}
.sch-go{margin-top:10px;font-size:11px;font-weight:700;color:#1c2338;border-top:1px dotted #9fb2c8;padding-top:8px}
.gate-foot{margin-top:18px;font-size:11px;color:#999}

/* ---------- 본 화면 ---------- */
#app{max-width:1120px;margin:0 auto;padding:10px 16px 40px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--deep);color:#fff;padding:7px 12px;font-size:12px}
.bar .logo{color:#fff;font-size:13px}
.bar .who{margin-left:auto}
.bar .who b{color:var(--point)}
.bar button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:2px 8px;font-size:11px}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}

/* 일촌 목록 */
.roster{background:var(--paper);border:1px solid var(--line);position:sticky;top:10px}
.roster h2{margin:0;padding:7px 10px;font-size:12px;background:var(--soft);border-bottom:1px solid var(--line);color:var(--deep)}
.rgroup{padding:6px 0 4px;border-bottom:1px dotted var(--line)}
.rgroup:last-child{border-bottom:0}
.rlabel{font-size:11px;font-weight:700;padding:2px 10px 4px;color:var(--sub);display:flex;gap:6px;align-items:center}
.rlabel span{font-weight:400;color:var(--point)}
.rrow{display:flex;gap:8px;align-items:center;width:100%;padding:5px 10px;background:none;border:0;text-align:left;min-width:0}
.rrow:hover{background:var(--soft)}
.rrow.on{background:var(--main);color:#fff}
.rrow.on .rsub{color:rgba(255,255,255,.85)}
.rav{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--line);background:#e9edf2 center/cover;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#8a96a6}
.rtx{min-width:0;flex:1}
.rname{display:block;font-weight:700;font-size:12px;line-height:1.3}
.rsub{display:block;font-size:11px;line-height:1.3;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtag{font-size:10px;border:1px solid currentColor;padding:0 4px;flex:0 0 auto;opacity:.8}

/* 미니홈피 창 */
.hompy{background:var(--paper);border:1px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.08);min-width:0}
.htitle{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 12px;border-bottom:2px solid var(--main)}
.htitle h1{margin:0;font-size:17px;letter-spacing:-.02em;color:var(--deep);word-break:keep-all}
.hcount{margin-left:auto;font-size:11px;color:var(--sub)}
.hcount b{color:var(--point);font-size:13px}
.hnote{background:var(--point);color:#fff;font-weight:700;padding:6px 12px;font-size:12px}
.hbody{display:grid;grid-template-columns:196px minmax(0,1fr)}
.side{border-right:1px dotted var(--line);padding:12px;background:var(--soft)}
.pic{width:100%;aspect-ratio:1/1;border:1px solid var(--line);background:#fff center/cover;display:flex;align-items:center;justify-content:center;text-align:center;color:#a0a9b5;font-size:11px;line-height:1.4;padding:8px}
.mood{font-size:11px;margin:8px 0 2px;color:var(--sub)}
.mood b{color:var(--main)}
.status{font-family:var(--hand);font-weight:700;font-size:15px;line-height:1.5;margin:4px 0 10px;word-break:keep-all;min-height:24px}
.meta{font-size:11px;border-top:1px dotted var(--line);padding-top:8px;margin:0}
.meta div{display:flex;gap:6px}
.meta dt{flex:0 0 34px;color:var(--sub)}
.meta dd{margin:0}
.bgm{margin-top:10px;border:1px solid var(--line);background:#fff;padding:5px 7px;font-size:11px}
.bgm-t{color:var(--sub);font-size:10px;letter-spacing:.08em}
.bgm-s{overflow:hidden;white-space:nowrap}
.bgm-s span{display:inline-block;padding-left:100%;animation:mq 11s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.wave{margin-top:10px;width:100%;font-family:inherit;font-size:12px;padding:4px;border:1px solid var(--line);background:#fff}
.main{min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;overflow-x:auto}
.tab{flex:0 0 auto;border:0;border-right:1px solid var(--line);background:#f4f6f8;padding:7px 13px;font-size:12px;color:var(--sub)}
.tab.on{background:var(--main);color:#fff;font-weight:700}
.tab small{font-size:10px;opacity:.85}
.pane{padding:14px;min-height:340px}
.sec{margin:0 0 16px}
.sec h3{margin:0 0 6px;font-size:12px;color:var(--deep);border-bottom:1px solid var(--line);padding-bottom:3px;display:flex;justify-content:space-between}
.sec h3 span{font-weight:400;color:var(--sub);font-size:11px}
.empty{padding:34px 10px;text-align:center;color:#9aa3ad;border:1px dotted var(--line);background:#fafbfc}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;padding:4px 2px;border-bottom:1px dotted #dfe5ec;font-size:12px}
.list .d{color:var(--sub);flex:0 0 auto;font-size:11px}
.list .t{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ilchon li{display:block}
.ilchon b{color:var(--main)}
.post{border:1px solid var(--line);margin-bottom:10px;background:#fff}
.post-h{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;background:var(--soft);font-size:12px;font-weight:700;color:var(--deep)}
.post-h span{font-weight:400;color:var(--sub);font-size:11px;flex:0 0 auto}
.post-b{padding:16px 16px 18px;font-family:var(--hand);font-size:14.5px;line-height:1.9;white-space:pre-line;word-break:keep-all;color:#333}
.post-b.ac{text-align:center}.post-b.ar{text-align:right}
.post-b b{font-weight:800;color:inherit}
.post-b>b{color:#000}
.c-r{color:#d2232a}.c-b{color:#2b5fc7}.c-p{color:#e9559c}.c-g{color:#a9a9a9}.c-o{color:#e58a00}.c-v{color:#8a4fd0}
.f-l{font-size:1.35em}.f-s{font-size:.85em}.f-u{text-decoration:underline}
.post.lock .post-b{font-family:var(--gothic);font-size:12px;color:#9aa3ad;background:repeating-linear-gradient(135deg,#fafafa 0 6px,#f1f3f5 6px 12px)}
.cmt{border-top:1px dotted var(--line);padding:5px 12px;font-size:12px;background:#fcfdfe}
.cmt b{color:var(--main)}
.cmt.me b{color:var(--point)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);background:#fff;padding:5px}
.ph-i{aspect-ratio:4/3;background:#eef1f5 center/cover;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#a0a9b5;padding:6px}
.ph.lock .ph-i{background:repeating-linear-gradient(135deg,#f3f3f3 0 6px,#e6e8eb 6px 12px);color:#7d8793;font-weight:700}
.ph-c{font-size:12px;padding:5px 2px 1px;word-break:keep-all}
.ph-c small{display:block;color:var(--sub);font-size:11px}
.g{border-bottom:1px dotted var(--line);padding:8px 2px}
.g-h{font-size:11px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap}
.g-h b{color:var(--main);font-size:12px}
.g-b{font-size:13px;margin-top:2px;word-break:keep-all}
.g-r{margin:5px 0 0 14px;padding:4px 8px;background:var(--soft);font-size:12px;border-left:2px solid var(--main)}
.gform{display:flex;gap:6px;margin-bottom:10px}
.gform input{flex:1;min-width:0;font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line)}
.gform button{background:var(--main);color:#fff;border:0;padding:0 14px;font-weight:700}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border:1px solid var(--line);margin-bottom:14px}
.stat div{padding:6px 9px;border-right:1px dotted var(--line);border-bottom:1px dotted var(--line);font-size:12px}
.stat small{display:block;color:var(--sub);font-size:10px}
.qna{margin:0;border-top:1px solid var(--line)}
.qna div{display:grid;grid-template-columns:150px minmax(0,1fr);border-bottom:1px dotted var(--line)}
.qna dt{padding:5px 8px;background:var(--soft);font-size:12px;color:var(--deep)}
.qna dd{margin:0;padding:5px 9px;font-size:13px;word-break:keep-all}
.locked{padding:46px 16px;text-align:center}
.locked .big{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--deep);margin:10px 0 4px}
.locked p{margin:2px 0;color:var(--sub)}
.locked .trace{display:inline-block;margin-top:16px;text-align:left;border:1px dotted var(--line);padding:8px 12px;font-size:12px;background:#fafbfc}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;font-size:13px;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.foot{margin-top:14px;text-align:center;font-size:11px;color:#8b95a1}

@media (max-width:860px){
  .schools{grid-template-columns:1fr}
  .sch{display:grid;grid-template-columns:64px 1fr}
  .sch-band{height:auto;flex-direction:column}
  .layout{grid-template-columns:1fr}
  .roster{position:sticky;top:0;z-index:20;display:flex;overflow-x:auto;border-left:0;border-right:0;margin:0 -16px;padding:0 8px}
  .roster h2{display:none}
  .rgroup{display:flex;flex:0 0 auto;border-bottom:0;border-right:1px dotted var(--line);padding:6px 4px;align-items:center}
  .rlabel{writing-mode:vertical-rl;padding:0 2px;font-size:10px}
  .rlabel span{display:none}
  .rrow{flex-direction:column;gap:2px;width:58px;padding:3px 2px;text-align:center}
  .rrow .rsub,.rrow .rtag{display:none}
  .rname{font-size:11px;white-space:nowrap}
  .hbody{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px dotted var(--line);display:grid;grid-template-columns:104px minmax(0,1fr);gap:0 12px;align-items:start}
  .side .pic{grid-row:1/5}
  .mood{margin-top:0}
  .bgm,.wave{grid-column:1/3}
  .qna div{grid-template-columns:104px minmax(0,1fr)}
  body{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.bgm-s span{animation:none;padding-left:0}}
/* 이미지 */
.def{position:absolute;inset:0;width:100%;height:100%;display:block}
.pic{padding:0}
.pic,.ph-i,.rav{position:relative;overflow:hidden}
.im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph-i.zoom{cursor:zoom-in}
.view{position:fixed;inset:0;z-index:60;background:rgba(20,28,40,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.view-in{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
.view-top{display:flex;justify-content:space-between;align-items:center;background:var(--main);color:#fff;padding:5px 10px;font-size:12px;font-weight:700}
.view-x{background:#fff;color:var(--deep);border:0;border-radius:4px;width:22px;height:20px;font-size:11px;font-weight:700;line-height:1}
.view-in img{display:block;max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;background:#111}
.view-cap{padding:8px 12px;font-size:13px}
.view-cap span{color:var(--sub);font-size:12px;margin-left:6px}
/* 둥근 테두리 */
.gate-box,.hompy,.roster{border-radius:var(--r);overflow:hidden}
.roster{overflow:auto}
.sch,.post,.ph,.stat,.bgm,.empty,.locked .trace{border-radius:8px;overflow:hidden}
.pic,.ph-i,.rav{border-radius:6px}
.bar{border-radius:var(--r)}
.bar button,.wave,.gform input,.gform button,.rtag{border-radius:12px}
.gform button{padding:0 16px}
.tab{border-radius:8px 8px 0 0;margin:4px 0 0 4px;border:1px solid var(--line);border-bottom:0}
.g-r{border-radius:0 6px 6px 0}
.toast{border-radius:18px}
@media (max-width:860px){.roster{border-radius:0}}
</style>
</head>

<script>

/* 이미지 경로 자동 지정: img/아이디.png (프로필 1:1) · img/아이디_번호.png (사진첩 4:3)

CHARS.forEach(c=>{ if(!c.img) c.img=`img/${c.id}.png`; c.photos.forEach((x,i)=>{ if(!x.img) x.img=`img/${c.id}_${i+1}.png`; }); });

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

        <div class="pic">${DEF}${pic(c.img,c.name+' 프로필 사진')}</div>
        <div class="mood">TODAY IS... <b>${esc(c.mood)}</b></div>
        <div class="status">${fmt(status)||'&nbsp;'}</div>
        <dl class="meta">
          <div><dt>이름</dt><dd>${esc(c.name)}</dd></div>
          <div><dt>학교</dt><dd>${esc(SCHOOLS[c.school].name)}</dd></div>
          <div><dt>소속</dt><dd>${esc(c.cls)}</dd></div>
        </dl>
        <div class="bgm"><div class="bgm-t">BGM</div>${c.bgm?`<div class="bgm-s"><span>♬ ${esc(c.bgm)} ♬</span></div>`:'<div>설정된 배경음악이 없습니다</div>'}</div>
        <select class="wave" aria-label="일촌 파도타기"><option value="">일촌 파도타기 ~</option>
          ${CHARS.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}">${esc(SCHOOLS[x.school].name)} · ${esc(x.name)}</option>`).join('')}</select>
      </aside>
      <div class="main">
        <div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab${S.tab===t[0]?' on':''}" role="tab" data-t="${t[0]}">${t[1]}${t[2]!==undefined?` <small>(${t[2]})</small>`:''}</button>`).join('')}</div>
        <div class="pane" id="pane"></div>
      </div>
    </div>`;
  $('.wave',h).onchange=e=>{ if(e.target.value) go(e.target.value); };
  h.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; h.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b)); renderPane(); });
  renderPane();
}

const fmt = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\{([rbpgov]):([^}]*)\}/g,'<span class="c-$1">$2</span>')
  .replace(/\{([LSU]):([^}]*)\}/g,(m,k,v)=>`<span class="f-${k.toLowerCase()}">${v}</span>`)
  .replace(/\{([rbpgov]):([^}]*)\}/g,'<span class="c-$1">$2</span>');
const cmtHtml = cs => (cs||[]).map(x=>`<div class="cmt"><b>${esc(x[0])}</b> ${esc(x[1])}</div>`).join('');

function renderPane(){
  const c=byId(S.cur), p=$('#pane'), same=c.school===S.viewer;
  const guestOpen=!c.guestOpen||c.guestOpen.includes(S.viewer);
  const mine=S.extra[c.id]||[];
  if(S.tab==='home'){
    const recent=[...c.diary.filter(d=>!d.lock).slice(0,3).map(d=>[d.d,'[다이어리] '+d.t]),...c.photos.slice(0,2).map(x=>[x.sub||'','[사진첩] '+x.cap])];
    p.innerHTML=`
      <div class="sec"><h3>최근 게시물 <span>${c.diaryNote?esc(c.diaryNote):''}</span></h3>
        ${c.diaryAllLock?'<div class="empty">모든 게시물이 비공개입니다.</div>':recent.length?`<ul class="list">${recent.map(r=>`<li><span class="t">${esc(r[1])}</span><span class="d">${esc(r[0])}</span></li>`).join('')}</ul>`:'<div class="empty">등록된 게시물이 없습니다.</div>'}
      </div>
      ${c.visitors&&same?`<div class="sec"><h3>방문자 추적기 <span>주인장 전용 위젯 · 켜져 있음</span></h3><ul class="list">${c.visitors.map(v=>`<li><span class="t">${esc(v)}</span></li>`).join('')}</ul></div>`:''}
      <div class="sec"><h3>일촌평 <span>${c.ilchon.length}명</span></h3>
        <ul class="list ilchon">${c.ilchon.map(i=>`<li><b>${esc(i[0])}</b> ${esc(i[1])}</li>`).join('')}</ul></div>`;
  }
  else if(S.tab==='diary'){
    if(c.diaryAllLock) p.innerHTML='<div class="empty">다이어리 전체가 비공개로 설정되어 있습니다.<br>일촌에게도 열려 있지 않습니다.</div>';
    else if(!c.diary.length) p.innerHTML='<div class="empty">등록된 게시물이 없습니다.</div>';
    else p.innerHTML=(c.diaryNote?`<div class="sec"><h3>다이어리 <span>${esc(c.diaryNote)}</span></h3></div>`:'')+c.diary.map(d=>d.lock
      ?`<article class="post lock"><div class="post-h">${esc(d.t)} <span>${esc(d.d)}</span></div><div class="post-b">비공개 글입니다. 주인장만 볼 수 있습니다.</div></article>`
      :`<article class="post"><div class="post-h">${esc(d.t)} <span>${esc(d.d)}</span></div><div class="post-b${d.a?' a'+d.a:''}">${fmt(d.b)}</div>${cmtHtml(d.cmts)}</article>`).join('');
  }
  else if(S.tab==='photo'){
    p.innerHTML=c.photos.length?`<div class="photos">${c.photos.map(x=>{
      const lk=(x.ilchon||x.cap==='일촌 공개')&&!same;
      return lk?`<figure class="ph lock" style="margin:0"><div class="ph-i">일촌 공개<br>사진입니다</div><figcaption class="ph-c">잠긴 사진</figcaption></figure>`
        :`<figure class="ph" style="margin:0"><div class="ph-i" data-cap="${esc(x.cap==='일촌 공개'?'우리끼리만':x.cap)}" data-sub="${esc(x.sub)}">[ 사진 4:3 ]${pic(x.img,x.cap)}</div><figcaption class="ph-c">${esc(x.cap==='일촌 공개'?'우리끼리만':x.cap)}<small>${esc(x.sub)}</small></figcaption>${cmtHtml(x.cmts)}</figure>`;}).join('')}</div>`
      :'<div class="empty">등록된 사진이 없습니다.</div>';
  }
  if(S.tab==='photo') p.querySelectorAll('.ph-i').forEach(b=>{ b.onclick=()=>{ const im=b.querySelector('.im'); if(im&&b.classList.contains('zoom')) openView(im.src,b.dataset.cap,b.dataset.sub); }; });
  if(S.tab==='guest'){
    if(!guestOpen){ p.innerHTML='<div class="empty">방명록이 닫혀 있습니다.<br>주인장이 허락한 일촌에게만 보입니다.</div>'; return; }
    p.innerHTML=`<form class="gform"><input type="text" maxlength="60" placeholder="방명록 한 줄 남기기" aria-label="방명록 입력"><button>등록</button></form>
      ${mine.map(m=>`<div class="g"><div class="g-h"><b>${esc(SCHOOLS[S.viewer].name)} 익명</b><span>방금</span></div><div class="g-b">${esc(m)}</div></div>`).join('')}
      ${c.guest.map(g=>`<div class="g"><div class="g-h"><b>${esc(g[0])}</b><span>${esc(g[1])}</span></div><div class="g-b">${esc(g[2])}</div>${g[3]?`<div class="g-r">${g[3].startsWith('(')?'':`<b>${esc(c.name)}</b> `}${esc(g[3])}</div>`:''}</div>`).join('')}`;
    $('.gform',p).onsubmit=e=>{
      e.preventDefault();
      const block=(c.guestBlock||{})[S.viewer];
      if(block){ toast(block); return; }
      const v=$('input',p).value.trim(); if(!v) return;
      (S.extra[c.id]=S.extra[c.id]||[]).unshift(v); renderPane();
      toast(same?'방명록이 등록되었습니다.':'타교생 방명록으로 등록되었습니다. 소문은 내일 퍼집니다.');
    };
  }
  else if(S.tab==='profile'){
    p.innerHTML=`<div class="stat">
        <div><small>이름</small>${esc(c.name)}</div><div><small>나이</small>${esc(c.age)}세</div>
        <div><small>키</small>${esc(c.height)}</div><div><small>소속</small>${esc(SCHOOLS[c.school].name)} ${esc(c.cls)}</div>
        <div><small>통하는 이름</small>${esc(c.tag)}</div></div>
      <div class="sec"><h3>20문 20답</h3>
      ${c.qna?`<dl class="qna">${QUESTIONS.map((q,i)=>`<div><dt>${i+1}. ${esc(q)}</dt><dd>${esc(c.qna[i])||'&nbsp;'}</dd></div>`).join('')}</dl>`
        :'<div class="empty">작성된 문답이 없습니다.<br>바통을 받았지만 넘기지 않았습니다.</div>'}</div>`;
  }
}

function openView(src,cap,sub){
  closeView();
  const v=document.createElement('div'); v.className='view'; v.setAttribute('role','dialog'); v.setAttribute('aria-label','사진 크게 보기');
  v.innerHTML=`<div class="view-in"><div class="view-top"><span>사진 보기</span><button class="view-x" aria-label="닫기">X</button></div><img src="${esc(src)}" alt="${esc(cap)}"><div class="view-cap"><b>${esc(cap)}</b>${sub?` <span>${esc(sub)}</span>`:''}</div></div>`;
  v.onclick=e=>{ if(e.target===v||e.target.classList.contains('view-x')) closeView(); };
  document.body.appendChild(v); v.querySelector('.view-x').focus();
}
function closeView(){ document.querySelectorAll('.view').forEach(v=>v.remove()); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeView(); });

renderGate();
</script>
</body>
</html>
